<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | LabCore</title>
<link rel="stylesheet" href="shared/labcore-nav.css">
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1a2a22 0%, #245b86 100%);
  font-family: 'Segoe UI', Arial, sans-serif;
  margin: 0;
  padding: 20px;
}
.login-card {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  width: 460px;
  max-width: 100%;
  padding: 36px 32px 28px;
}
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.brand-mark {
  width: 44px; height: 44px; background: #d5b36a; color: #202522;
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 18px;
}
.brand h1 { font-size: 22px; margin: 0; color: #202522; }
.brand p { font-size: 12px; color: #7a7f7b; margin: 2px 0 0; }
.subtitle { font-size: 13px; color: #5a6560; margin: 18px 0 16px; }

label { display: block; font-size: 11px; font-weight: 600; color: #555a56; margin-bottom: 4px; }
input[type=email] {
  width: 100%; padding: 11px 12px; border: 1px solid #d1d3d0;
  border-radius: 6px; font-size: 14px; margin-bottom: 16px;
  box-sizing: border-box;
  font-family: inherit;
}
input[type=email]:focus {
  outline: none; border-color: #245b86;
  box-shadow: 0 0 0 3px rgba(36,91,134,0.15);
}

.pin-row {
  display: flex; gap: 8px; justify-content: center;
  margin-bottom: 16px;
}
.pin-digit {
  width: 52px; height: 62px; text-align: center;
  font-size: 24px; font-weight: 700;
  border-radius: 10px; border: 2px solid #d1d3d0;
  background: #fff; color: #252525;
  transition: border-color 0.2s;
  font-family: inherit;
}
.pin-digit:focus {
  outline: none; border-color: #245b86;
  box-shadow: 0 0 0 4px rgba(36,91,134,0.15);
}
.pin-digit.filled { border-color: #245b86; }

.btn {
  width: 100%; padding: 12px; border: none; border-radius: 6px;
  background: #252a27; color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: 0.2s;
}
.btn:hover { background: #3b413d; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.hint {
  margin-top: 16px; font-size: 11px; color: #8a908b;
  text-align: center; line-height: 1.6;
}
.error {
  background: #fce4e0; color: #842029; padding: 8px 12px;
  border-radius: 6px; font-size: 12px; margin-bottom: 12px; display: none;
}
.error.show { display: block; }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <div class="brand-mark">LC</div>
    <div>
      <h1>LabCore</h1>
      <p>Laboratory Information System</p>
    </div>
  </div>
  <div class="subtitle">Sign in with your email and PIN</div>

  <div class="error" id="errorBox"></div>

  <label>Email</label>
  <input type="email" id="email" placeholder="you@hospital.gh" autocomplete="username">

  <label>PIN</label>
  <div class="pin-row" id="pinRow">
    <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" data-index="0" autocomplete="off">
    <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" data-index="1" autocomplete="off">
    <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" data-index="2" autocomplete="off">
    <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" data-index="3" autocomplete="off">
  </div>

  <button class="btn" id="loginBtn" onclick="doLogin()" disabled>Continue</button>

  <div class="hint">
    Contact your administrator if you have forgotten your PIN.
  </div>
</div>

<script src="shared/labcore-auth.js"></script>
<script src="shared/labcore-staff.js"></script>
<script>
/* Already logged in? Go straight to dashboard */
(function () {
  var u = window.lcGetUser && window.lcGetUser();
  if (u) window.location.href = 'dashboard.html';
})();

/* ---------- PIN input handling ---------- */
document.querySelectorAll('.pin-digit').forEach(function (input, idx, arr) {
  input.addEventListener('input', function () {
    var v = this.value.replace(/\D/g, '');
    this.value = v.slice(-1);
    this.classList.toggle('filled', this.value.length === 1);
    if (this.value && idx < arr.length - 1) arr[idx + 1].focus();
    updateLoginButton();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Backspace' && !this.value && idx > 0) arr[idx - 1].focus();
    if (e.key === 'Enter') {
      var btn = document.getElementById('loginBtn');
      if (!btn.disabled) btn.click();
    }
  });
  input.addEventListener('paste', function (e) {
    e.preventDefault();
    var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
    if (!paste) return;
    for (var i = 0; i < arr.length; i++) {
      arr[i].value = paste[i] || '';
      arr[i].classList.toggle('filled', !!arr[i].value);
    }
    updateLoginButton();
  });
});

document.getElementById('email').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    var btn = document.getElementById('loginBtn');
    if (!btn.disabled) btn.click();
    else document.querySelector('.pin-digit').focus();
  }
});

function getPin() {
  return Array.from(document.querySelectorAll('.pin-digit')).map(function (d) { return d.value; }).join('');
}

function updateLoginButton() {
  var btn = document.getElementById('loginBtn');
  var email = document.getElementById('email').value.trim();
  var allFilled = Array.from(document.querySelectorAll('.pin-digit')).every(function (d) { return d.value.length === 1; });
  btn.disabled = !(email && allFilled);
}

document.getElementById('email').addEventListener('input', updateLoginButton);

function clearPin() {
  document.querySelectorAll('.pin-digit').forEach(function (d) { d.value = ''; d.classList.remove('filled'); });
  updateLoginButton();
  setTimeout(function () { document.querySelector('.pin-digit').focus(); }, 50);
}

function showError(msg) {
  var el = document.getElementById('errorBox');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 5000);
}

/* ---------- Login ---------- */
function doLogin() {
  var email = document.getElementById('email').value.trim();
  if (!email) { showError('Please enter your email.'); return; }

  var pin = getPin();
  if (pin.length !== 4) { showError('Please enter your 4-digit PIN.'); return; }

  var staff = window.lcFindStaffByEmail ? window.lcFindStaffByEmail(email) : null;
  if (!staff) { showError('No account found for that email.'); clearPin(); return; }
  if (staff.status === 'disabled') { showError('This account has been disabled.'); return; }

  var result = window.lcAuthenticateStaff(staff.id, pin);
  if (!result.ok) {
    if (result.reason === 'wrong_pin') { showError('Incorrect PIN'); clearPin(); return; }
    if (result.reason === 'disabled') { showError('This account has been disabled.'); return; }
    showError('Login failed: ' + (result.reason || 'unknown'));
    return;
  }

  window.lcSetStaffUser(result.staff);
  window.location.href = 'dashboard.html';
}

/* ---------- Init ---------- */
updateLoginButton();
setTimeout(function () { document.getElementById('email').focus(); }, 80);
</script>
</body>
</html>
